name: Publish signed Waxball news
on:
  push:
    branches: [main]
    paths: ['control-plane/**', '.github/workflows/deploy-news.yml', 'policy-updates/**', 'tools/verify_news.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: akra-waxball-web-delivery
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gh-pages
          path: site
      - name: Overlay generated public news and policy files
        run: |
          set -euo pipefail
          test -s site/index.html
          test "$(cat site/CNAME)" = 'waxball.akra.kr'
          test -s source/control-plane/apps/waxball/channels/production/release.json
          python3 source/tools/verify_news.py source/control-plane
          cp -a source/control-plane site/
          if [ -d source/policy-updates ]; then cp -a source/policy-updates/. site/; fi
          git -C site config user.name 'github-actions[bot]'
          git -C site config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C site add control-plane privacy terms
          if git -C site diff --cached --quiet; then exit 0; fi
          git -C site commit -m 'Publish signed Waxball news and disclosures'
          git -C site push origin HEAD:gh-pages
