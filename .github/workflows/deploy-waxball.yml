name: Deploy exact Waxball handoff

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Private build workflow run ID
        required: true
        type: string
      source_run_attempt:
        description: Private build workflow run attempt
        required: true
        default: "1"
        type: string
      source_sha:
        description: Exact private main commit SHA to deploy
        required: true
        type: string
      handoff_tag:
        description: Temporary draft release tag
        required: true
        type: string
      handoff_asset:
        description: Generated web bundle release asset
        required: true
        type: string
      handoff_sha256:
        description: SHA-256 digest of the handoff asset
        required: true
        type: string
      force:
        description: Redeploy even when the source commit is unchanged
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: waxball-pages-sync
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: akra-devs/akra-waxball-flutter
  SOURCE_WORKFLOW: deploy-pages.yml
  MINIMUM_SOURCE_SHA: f00933b3881021132e7288e0947e88948de0420e

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: waxball-production
      url: https://waxball.akra.kr/
    steps:
      - name: Resolve requested private build and handoff
        id: resolve
        shell: bash
        env:
          SOURCE_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          TARGET_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.source_run_id }}
          REQUESTED_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          REQUESTED_HANDOFF_TAG: ${{ inputs.handoff_tag }}
          REQUESTED_HANDOFF_ASSET: ${{ inputs.handoff_asset }}
          REQUESTED_HANDOFF_SHA256: ${{ inputs.handoff_sha256 }}
          FORCE_DEPLOY: ${{ inputs.force }}
        run: |
          set -euo pipefail
          set +x

          if [[ -z "${SOURCE_TOKEN:-}" ]]; then
            echo '::error title=Missing PERSONAL_TOKEN::The public deployment repository cannot verify the private source run.'
            exit 1
          fi

          if ! source_is_private="$(GH_TOKEN="$SOURCE_TOKEN" gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${SOURCE_REPOSITORY}" --jq '.private')"; then
            echo '::error title=Private source unavailable::PERSONAL_TOKEN cannot read the private Waxball source repository.'
            exit 1
          fi

          if [[ "$source_is_private" != 'true' ]]; then
            echo '::error title=Source privacy changed::Expected the Waxball source repository to remain private.'
            exit 1
          fi

          if [[ ! "$REQUESTED_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo '::error title=Invalid source run::source_run_id must be numeric.'
            exit 1
          fi
          if [[ ! "$REQUESTED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error title=Invalid source attempt::source_run_attempt must be a positive integer.'
            exit 1
          fi
          if [[ ! "$REQUESTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error title=Invalid source SHA::source_sha must be a full lowercase commit SHA.'
            exit 1
          fi
          if [[ "$REQUESTED_HANDOFF_TAG" != "waxball-handoff-${REQUESTED_RUN_ID}-${REQUESTED_RUN_ATTEMPT}" ]]; then
            echo '::error title=Invalid handoff tag::The handoff tag does not match the requested private run.'
            exit 1
          fi
          if [[ "$REQUESTED_HANDOFF_ASSET" != "waxball-web-${REQUESTED_RUN_ID}-${REQUESTED_RUN_ATTEMPT}.tar" ]]; then
            echo '::error title=Invalid handoff asset::The asset name does not match the requested private run.'
            exit 1
          fi
          if [[ ! "$REQUESTED_HANDOFF_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error title=Invalid handoff digest::handoff_sha256 must be a lowercase SHA-256 digest.'
            exit 1
          fi

          run_json=''
          for poll in $(seq 1 30); do
            run_json="$(GH_TOKEN="$SOURCE_TOKEN" gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${SOURCE_REPOSITORY}/actions/runs/${REQUESTED_RUN_ID}")"
            if [[ "$(jq -r '.status' <<<"$run_json")" == 'completed' ]]; then
              break
            fi
            echo "Private build is still finalizing (${poll}/30)."
            sleep 2
          done

          run_id="$(jq -r '.id // empty' <<<"$run_json")"
          run_attempt="$(jq -r '.run_attempt // empty' <<<"$run_json")"
          source_sha="$(jq -r '.head_sha // empty' <<<"$run_json")"
          source_branch="$(jq -r '.head_branch // empty' <<<"$run_json")"
          source_event="$(jq -r '.event // empty' <<<"$run_json")"
          source_status="$(jq -r '.status // empty' <<<"$run_json")"
          source_conclusion="$(jq -r '.conclusion // empty' <<<"$run_json")"
          source_workflow_path="$(jq -r '.path // empty' <<<"$run_json")"

          if [[ "$run_id" != "$REQUESTED_RUN_ID" ||
                "$run_attempt" != "$REQUESTED_RUN_ATTEMPT" ||
                "$source_sha" != "$REQUESTED_SOURCE_SHA" ||
                "$source_branch" != 'main' ||
                "$source_event" != 'workflow_dispatch' ||
                "$source_status" != 'completed' ||
                "$source_conclusion" != 'success' ||
                "$source_workflow_path" != ".github/workflows/${SOURCE_WORKFLOW}" ]]; then
            echo '::error title=Untrusted source build::The requested private run did not match the expected successful main release.'
            exit 1
          fi

          comparison="$(GH_TOKEN="$SOURCE_TOKEN" gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${SOURCE_REPOSITORY}/compare/${MINIMUM_SOURCE_SHA}...${source_sha}" \
            --jq '.status')"
          if [[ "$comparison" != 'ahead' && "$comparison" != 'identical' ]]; then
            echo '::error title=Build predates release handoff::The requested source predates the supported deployment flow.'
            exit 1
          fi

          releases_json="$(GH_TOKEN="$TARGET_TOKEN" gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          release_json="$(jq -c --arg tag "$REQUESTED_HANDOFF_TAG" '
            [.[] | select(.tag_name == $tag and .draft == true)][0] // empty
          ' <<<"$releases_json")"
          if [[ -z "$release_json" ]]; then
            echo '::error title=Missing handoff release::The requested temporary draft release was not found.'
            exit 1
          fi

          release_tag="$(jq -r '.tag_name // empty' <<<"$release_json")"
          release_target="$(jq -r '.target_commitish // empty' <<<"$release_json")"
          release_draft="$(jq -r '.draft // empty' <<<"$release_json")"
          asset_state="$(jq -r --arg name "$REQUESTED_HANDOFF_ASSET" \
            '[.assets[] | select(.name == $name)][0].state // empty' <<<"$release_json")"
          asset_size="$(jq -r --arg name "$REQUESTED_HANDOFF_ASSET" \
            '[.assets[] | select(.name == $name)][0].size // 0' <<<"$release_json")"
          asset_digest="$(jq -r --arg name "$REQUESTED_HANDOFF_ASSET" \
            '[.assets[] | select(.name == $name)][0].digest // empty' <<<"$release_json")"

          if [[ "$release_tag" != "$REQUESTED_HANDOFF_TAG" ||
                "$release_target" != 'main' ||
                "$release_draft" != 'true' ||
                "$asset_state" != 'uploaded' ||
                "$asset_size" -le 0 ||
                "$asset_digest" != "sha256:${REQUESTED_HANDOFF_SHA256}" ]]; then
            echo '::error title=Untrusted handoff release::The temporary release asset did not match the requested digest and metadata.'
            exit 1
          fi

          current_sha=''
          if current_b64="$(GH_TOKEN="$TARGET_TOKEN" gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/contents/.source-sha?ref=gh-pages" \
            --jq '.content' 2>/dev/null)"; then
            current_sha="$(printf '%s' "$current_b64" | base64 --decode | tr -d '\r\n')"
          fi

          if [[ "$source_sha" == "$current_sha" && "${FORCE_DEPLOY:-false}" != 'true' ]]; then
            echo "Waxball ${source_sha} is already deployed."
            {
              echo 'deploy=false'
              echo "source_sha=${source_sha}"
              echo "source_run_id=${run_id}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo 'deploy=true'
            echo "source_sha=${source_sha}"
            echo "source_run_id=${run_id}"
          } >> "$GITHUB_OUTPUT"

      - name: Download and verify public handoff
        if: steps.resolve.outputs.deploy == 'true'
        shell: bash
        env:
          TARGET_TOKEN: ${{ github.token }}
          HANDOFF_TAG: ${{ inputs.handoff_tag }}
          HANDOFF_ASSET: ${{ inputs.handoff_asset }}
          HANDOFF_SHA256: ${{ inputs.handoff_sha256 }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          set +x
          umask 077

          mkdir handoff site
          GH_TOKEN="$TARGET_TOKEN" gh release download "$HANDOFF_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$HANDOFF_ASSET" \
            --dir handoff

          archive="handoff/${HANDOFF_ASSET}"
          test -s "$archive"
          printf '%s  %s\n' "$HANDOFF_SHA256" "$archive" | sha256sum --check --strict

          tar -tf "$archive" > handoff/entries.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$))' handoff/entries.txt; then
            echo '::error title=Unsafe handoff::Archive paths must remain inside the site directory.'
            exit 1
          fi

          tar -xf "$archive" -C site
          rm -rf handoff

          test -s site/index.html
          test -s site/main.dart.wasm
          test -f site/.nojekyll
          test "$(cat site/CNAME)" = 'waxball.akra.kr'
          grep -Fq '<base href="/">' site/index.html

          if find site -type l -print -quit | grep -q .; then
            echo '::error title=Unsafe handoff::Symbolic links are not allowed in the Pages bundle.'
            exit 1
          fi

          printf '%s\n' "$SOURCE_SHA" > site/.source-sha

      - name: Publish gh-pages branch
        if: steps.resolve.outputs.deploy == 'true'
        shell: bash
        env:
          TARGET_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          set +x
          test -s site/index.html
          test -s site/main.dart.wasm
          test -f site/.nojekyll
          test "$(cat site/CNAME)" = 'waxball.akra.kr'
          test "$(cat site/.source-sha)" = "$SOURCE_SHA"
          grep -Fq '<base href="/">' site/index.html

          git init --initial-branch=gh-pages publish
          rsync -a --exclude='.git/' site/ publish/
          git -C publish config user.name 'github-actions[bot]'
          git -C publish config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C publish add --all
          git -C publish commit -m "Deploy Waxball from $SOURCE_SHA"
          git -C publish remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

          umask 077
          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'ASKPASS'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "${TARGET_TOKEN:?}" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"

          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 \
            git -C publish -c credential.helper= push --force origin HEAD:gh-pages

      - name: Delete temporary handoff release
        shell: bash
        env:
          TARGET_TOKEN: ${{ github.token }}
          HANDOFF_TAG: ${{ inputs.handoff_tag }}
        run: |
          set -euo pipefail
          GH_TOKEN="$TARGET_TOKEN" gh release delete "$HANDOFF_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --yes
